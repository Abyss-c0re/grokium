[project]
name = "grokium"
version = "0.2.0"
description = "Independent local-first zero-telemetry agent harness (Apache-2.0). Not affiliated with xAI or Grok."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Grokium contributors" }]
keywords = ["agent", "local", "llama", "zero-telemetry"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/local/grokium"
License = "https://www.apache.org/licenses/LICENSE-2.0"
Upstream-Inspiration = "https://github.com/xai-org/grok-build"

[project.scripts]
grokium = "grokium.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
