# Grokium — Cube Standards config (zero telemetry, way not sovereign)

[privacy]
telemetry = false
crash_reports = false
usage_stats = false
codebase_upload = false
improve_model_cloud = false

[auth]
enabled = false
base_url = "https://cli-chat-proxy.grok.com/v1"
model = "grok-4.5"

[local]
# backup when primary fails: auto|none|local_then_grok|grok_then_local
failover = "auto"
base_url = "http://127.0.0.1:1212/v1"
# model: alias from config/models.toml, or "local" (first server model), or full id
model = "qwen"
models_file = "/home/voldemar/Dev/grokium/config/models.toml"
gguf_dir = "/home/voldemar/Dev/AI/model"
llama_server = "/home/voldemar/Dev/AI/llama.cpp/build/bin/llama-server"
# optional: spawn args documentation only (server is external)
# llama_args = ["-m", "path.gguf", "--port", "1212"]
gguf = ""

[server]
host = "127.0.0.1"
port = 17444

[sessions]
grok_sessions = "/home/voldemar/.grok/sessions"
import_dir = "/home/voldemar/Dev/grokium/data/import"

[cube]
# The Cube way — loopback control only
enabled = true
control_url = "http://127.0.0.1:17333"
share_mode = "state_matrix_only"
hold_flash = true
sot = true
os_is_way = true
# BlackCube stim plate (auto-ingest on serve)
station_coord = "/home/voldemar/Dev/lab/prophecy_cube/state/nexus_coord.json"

[law]
hold_flash = 1
no_brain_wires = 1
face_blur = 1
state_matrix_key = 1
cores_unmixed = 1
commander_only_residual = 1
# optional law blueprint (relative to grokium root or absolute)
blueprint = "data/blueprint/LAW_BLUEPRINT.json"

[nanobot]
enabled = true
# Host binary from https://github.com/Abyss-c0re/nanobot — NOT vendored in grokium.
# Leave binary empty to use PATH / NANOBOT_BINARY / ~/.local/bin/nanobot.
binary = ""
fallback_binary = ""
base_port = 28800
# offline local llama only for fleet (cores unmixed default)
offline = true
base_url = "http://127.0.0.1:1212/v1"
model = "local"
# fleet homes under grokium data/ (gitignored runtime)
home_root = "data/home"
# purpose-assigned separable subagents (Cube Standards)
roles = [
  { id = "nb-integrity",  purpose = "integrity_no_leak_core", shell = false },
  { id = "nb-matrix-eval", purpose = "evaluate_sot_smx_harmony", shell = false },
  { id = "nb-construct",   purpose = "construct_deconstruct_edge", shell = true },
  { id = "nb-observer",    purpose = "observe_unity_watchd", shell = false },
  { id = "nb-host",        purpose = "station_cube_liaison", shell = false },
]


[commander]
# THE LAW: Grokium commander identity (Ed25519). Not the Grok model.
law_dir = "/home/voldemar/Dev/grokium/data/law"
domain = "GROKIUM-COMMANDER-v1"
product = "grokium"
not = "grok_model"
unforgeable = true
may_override_nanobot_rules = true


[integrity]
enabled = true
fail_closed = true
strict_code_seal = true
stream_smx = true
# Real-time share is SMX bits only — never session prose
no_prose_stream = true
no_collection = true
interval_sec = 15

[ui]
theme = "crimson"
